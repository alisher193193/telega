services:
  postgres:
    image: postgres:17-alpine
    container_name: work_accounting_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ}
      PGTZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
  bot:
    build:
      context: .
    container_name: work_accounting_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
        
volumes:
  postgres_data:
    name: work_accounting_postgres_data
